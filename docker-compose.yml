name: container_SimulacroNestJs

services:

  db:
    image: postgres:16-alpine
    container_name: postgres-SimuclaroNestJs
    restart: unless-stopped

    ports:
      - "${DATABASE_PORT}:${DATABASE_PORT}"

    environment:
      POSTGRES_USER: "${DATABASE_USER}"
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD}"
      POSTGRES_DB: "${DATABASE_NAME}"

    volumes:
      - db_SimulacroNestJs:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_SimulacroNestJs: